site_name: xgfalclient
site_description: A pure-Python replacement for gfal2 and gfal2-util
site_url: https://rob-c.github.io/xgfalclient/
repo_url: https://github.com/rob-c/xgfalclient
copyright: LGPL-3.0-or-later

theme:
  name: material
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/weather-sunny
        name: Light mode

nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - JSON and XML output: output.md
  - VOMS proxies: voms.md
  - Platforms and packages: platforms.md
  - gfal2 compatibility: compatibility.md
  - Reliability and recovery: reliability.md
  - Performance: performance.md
  - Security: security.md
  - Contributing:
      - Developing: DEVELOPING.md
      - Releasing: releasing.md

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences

plugins:
  - search

watch:
  - src/xgfalclient
  - src/gfal2
  - src/gfal2_util

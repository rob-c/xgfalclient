# Builds the sdist and wheel on a version tag and uploads them to PyPI through
# trusted publishing (no API token: PyPI trusts this workflow's OIDC identity,
# registered under the project's "Publishing" settings, with the "pypi"
# environment).
#
# xgfalclient pins xrdclient exactly and is built on xrdcore, xrdsec and
# xrdhttp, all of which must already be on PyPI: the pre-flight refuses to
# publish otherwise, and the release wheel is then installed from PyPI alone,
# never from a checkout. Release order and the whole chain's runbook:
# docs/releasing.md in rob-c/xrdclient ("Releasing the 0.4.0 chain").
name: Publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # Every step but the upload is xrd-devtools' shared publish action: build,
  # `twine check --strict`, the pre-flight (xrdclient and the libraries are on
  # PyPI), then a clean install whose tag, runtime version and dated changelog
  # section agree.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: rob-c/xrd-devtools/.github/actions/publish@main
        with:
          package: xgfalclient
          preflight: true
          # The gfal2 and gfal2_util compatibility packages ship in the same
          # wheel and must survive installation, reporting gfal2's version.
          post-install: |
            "$PY" -I -c 'import gfal2, gfal2_util; assert gfal2.get_version() == "2.23.5", gfal2.get_version()'

  # Trusted publishing ties PyPI's trust to this job of this workflow, so the
  # upload stays here, in a job that only downloads what the build staged.
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

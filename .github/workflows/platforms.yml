# The distribution matrix of the whole chain is xrd-devtools' (rob-c/xrd-devtools,
# .github/workflows/platforms.yml, with the tools and packaging/ it runs).
# This repository runs it on its own commit, with the shared core
# (xrdclient) at the ref given.
name: Distribution packages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      xrdclient-ref:
        description: Matching shared-core candidate ref
        type: string
        default: main
      devtools-ref:
        description: rob-c/xrd-devtools ref
        type: string
        default: main

permissions:
  contents: read

jobs:
  platforms:
    uses: rob-c/xrd-devtools/.github/workflows/platforms.yml@main
    with:
      xrdclient-ref: ${{ inputs.xrdclient-ref || 'main' }}
      xgfalclient-ref: ${{ github.sha }}
      devtools-ref: ${{ inputs.devtools-ref || 'main' }}

[build-system]
# Hatchling 1.32 emits Core Metadata 2.5, which Twine 6.2 cannot validate.
# Keep isolated and CI builds reproducible until the inspection tool catches up.
requires = ["hatchling>=1.27,<1.32"]
build-backend = "hatchling.build"

[project]
name = "xgfalclient"
dynamic = ["version"]
description = "A Python 3, drop-in gfal2 client: WebDAV/HTTP, S3, Google Cloud Storage, XRootD, GridFTP, SRM, SFTP, dCap, LFC and local files, with X.509/GSI, token, Kerberos and SSH auth"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "LGPL-3.0-or-later" }
authors = [{ name = "Robert Currie", email = "robert.andrew.currie@gmail.com" }]
keywords = [
  "gfal", "gfal2", "grid", "wlcg", "hep", "webdav", "s3", "xrootd", "gridftp", "srm",
  "sftp", "dcap", "dcache", "lfc", "x509", "gsi", "kerberos",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: System :: Filesystems",
]
# Maintained libraries provide reusable parsing, transport and security primitives.
dependencies = [
  # Shared security/parsing APIs and XRootD transport are released together.
  "xrdclient==0.3.2",
  "asn1crypto>=1.5.1",
  "botocore>=1.35",
  "cryptography>=45",
  "PyJWT[crypto]>=2.10",
  "urllib3>=2.2",
]

[project.urls]
Homepage = "https://github.com/rob-c/xgfalclient"
Documentation = "https://rob-c.github.io/xgfalclient/"
Repository = "https://github.com/rob-c/xgfalclient"
Issues = "https://github.com/rob-c/xgfalclient/issues"
Changelog = "https://github.com/rob-c/xgfalclient/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# Compatibility alias: XRootD support is now included in the base install.
xrootd = []
# Native Kerberos bindings need system headers when no wheel is available.
krb5 = ["gssapi>=1.12,<2", "krb5>=0.10,<0.11"]
dev = [
  "build>=1,<2",
  "complexipy>=6,<7",
  "mypy>=1.10",
  "pytest>=8",
  "pytest-cov",
  "pytest-timeout",
  "pytest-xdist",
  "ruff>=0.5",
  "twine>=6,<7",
]
docs = ["mkdocs>=1.6,<2", "mkdocs-material>=9.5,<10"]

[project.scripts]
gfal-archivepoll = "xgfalclient.cli:archivepoll"
gfal-bringonline = "xgfalclient.cli:bringonline"
gfal-cat = "xgfalclient.cli:cat"
gfal-chmod = "xgfalclient.cli:chmod"
gfal-copy = "xgfalclient.cli:copy"
gfal-evict = "xgfalclient.cli:evict"
gfal-legacy-bringonline = "xgfalclient.cli:legacy_bringonline"
gfal-legacy-register = "xgfalclient.cli:legacy_register"
gfal-legacy-replicas = "xgfalclient.cli:legacy_replicas"
gfal-legacy-unregister = "xgfalclient.cli:legacy_unregister"
gfal-ls = "xgfalclient.cli:ls"
gfal-mkdir = "xgfalclient.cli:mkdir"
gfal-rename = "xgfalclient.cli:rename"
gfal-rm = "xgfalclient.cli:rm"
gfal-save = "xgfalclient.cli:save"
gfal-stat = "xgfalclient.cli:stat"
gfal-sum = "xgfalclient.cli:sum"
gfal-token = "xgfalclient.cli:token"
gfal-xattr = "xgfalclient.cli:xattr"
gfal2_version = "xgfalclient.cli:gfal2_version"
gfal_srm_ifce_version = "xgfalclient.cli:gfal_srm_ifce_version"

[tool.hatch.build.targets.wheel]
# gfal2 and gfal2_util are the import names of the packages this replaces.
packages = ["src/xgfalclient", "src/gfal2", "src/gfal2_util"]

# gfal2-util's man pages, generated from the commands' own parsers by
# tests/test_cli_man.py; pip installs them under <prefix>/share/man/man1.
[tool.hatch.build.targets.wheel.shared-data]
"share/man/man1" = "share/man/man1"

[tool.hatch.version]
# Keep the distribution metadata and the public VERSION/__version__ API identical.
path = "src/xgfalclient/_version.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Benchmark gate helpers are tested as ordinary project modules, while the
# installed packages themselves still come from the editable ``src`` build.
pythonpath = ["."]
timeout = 120
addopts = "-ra"
markers = [
  "interop: needs a real grid server (docker); skipped unless XGFAL_INTEROP=1",
]

[tool.coverage.run]
branch = true
source = ["xgfalclient", "gfal2", "gfal2_util"]
parallel = true
concurrency = ["thread"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true
exclude_also = [
  "if TYPE_CHECKING:",
  "@overload",
  "\\.\\.\\.$",
]

[tool.ruff]
line-length = 100
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "F", "W", "I", "B", "UP", "SIM", "RUF",
  # High-confidence security checks. The wider S family contains unavoidable
  # false positives for protocol-defined hashes, XML and subprocess transports.
  "S102", "S307", "S506", "S602", "S608", "S609", "S701",
]
ignore = ["RUF012", "SIM105", "UP007", "UP045", "RUF022"]

[tool.ruff.lint.per-file-ignores]
# The condition-coverage test intentionally executes an AST compiled entirely
# from a test-owned string; production code is still forbidden from using exec.
"tests/test_condcov.py" = ["S102"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/xgfalclient", "src/gfal2", "src/gfal2_util", "benchmarks"]

[tool.complexipy]
paths = ["src", "tests", "benchmarks"]
max-complexity-allowed = 15
failed = true

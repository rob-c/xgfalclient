[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xgfalclient"
version = "0.1.0"
description = "A pure-Python, drop-in gfal2 client: davs/https, root, gsiftp, srm and file, with X.509 and token auth"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "LGPL-3.0-or-later" }
authors = [{ name = "Robert Currie", email = "robert.andrew.currie@gmail.com" }]
keywords = ["gfal", "gfal2", "grid", "wlcg", "webdav", "gridftp", "srm", "xrootd", "hep"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: System :: Filesystems",
]
# The core, and every protocol but root://, is the standard library alone.
dependencies = []

[project.optional-dependencies]
# root:// and roots:// are spoken by xrdclient, which is itself pure Python.
xrootd = ["xrdclient>=0.1.0"]
# Kerberos works without this, through ctypes into the system libgssapi_krb5;
# with it installed, python-gssapi is used instead.
krb5 = ["gssapi>=1.6"]
dev = [
  "mypy>=1.10",
  "pytest>=8",
  "pytest-cov",
  "pytest-timeout",
  "pytest-xdist",
  "ruff>=0.5",
]

[project.scripts]
gfal-archivepoll = "xgfalclient.cli:archivepoll"
gfal-bringonline = "xgfalclient.cli:bringonline"
gfal-cat = "xgfalclient.cli:cat"
gfal-chmod = "xgfalclient.cli:chmod"
gfal-copy = "xgfalclient.cli:copy"
gfal-evict = "xgfalclient.cli:evict"
gfal-ls = "xgfalclient.cli:ls"
gfal-mkdir = "xgfalclient.cli:mkdir"
gfal-rename = "xgfalclient.cli:rename"
gfal-rm = "xgfalclient.cli:rm"
gfal-save = "xgfalclient.cli:save"
gfal-stat = "xgfalclient.cli:stat"
gfal-sum = "xgfalclient.cli:sum"
gfal-token = "xgfalclient.cli:token"
gfal-xattr = "xgfalclient.cli:xattr"

[tool.hatch.build.targets.wheel]
packages = ["src/xgfalclient"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 120
addopts = "-ra"
markers = [
  "interop: needs a real grid server (docker); skipped unless XGFAL_INTEROP=1",
]

[tool.coverage.run]
branch = true
source = ["xgfalclient"]
parallel = true
concurrency = ["thread"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true
exclude_also = [
  "if TYPE_CHECKING:",
  "@overload",
  "\\.\\.\\.$",
]

[tool.ruff]
line-length = 100
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF012", "SIM105", "UP007", "UP045", "RUF022"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/xgfalclient"]
warn_unused_ignores = false
